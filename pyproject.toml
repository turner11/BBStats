[project]
name = "bbstats"
version = "0.1.0"
description = "Basketball lineup +/- stats from per-snapshot sheets"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy"]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["bbstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits Google Sheets over the network"]
